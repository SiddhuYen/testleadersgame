<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leader Smash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">World Leader Smash</p>
          <h1>Pick the better face.</h1>
        </div>
        <nav class="nav-links">
          <a class="nav-link active" href="./index.html">Game</a>
          <a class="nav-link" href="./leaderboard.html">Leaderboard</a>
        </nav>
      </header>

      <main>
        <section class="matchup-header">
          <p>Tap the portrait you want to vote for. Ratings update instantly.</p>
        </section>

        <section id="status" class="status-card">Loading leaders...</section>

        <section id="matchup" class="matchup-grid hidden"></section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
